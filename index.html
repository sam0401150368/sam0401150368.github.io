<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>影片播放器 + 右側筆記 (自訂彩虹色盤)</title>
<style>
  html, body {
    margin:0; padding:0; height:100%; background:black;
    overflow: hidden;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    color: white;
  }
  #videoPlayer {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
    z-index: 0;
    display: block;
  }
  input[type="file"] {
    position: fixed; top: 10px; left: 10px; z-index: 100;
  }
  #notesContainer {
    position: fixed;
    top: 0;
    left: calc(100vw - 340px);
    width: 340px;
    height: calc(100vh - 40px);
    background: rgba(255,255,255,0.92);
    color: #333;
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
    box-sizing: border-box;
    box-shadow: -3px 0 10px rgba(0,0,0,0.5);
    z-index: 10;
    overflow: visible;
    min-width: 240px;
    min-height: 250px;
  }
  
  #addNoteForm {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 3px;
  }
  .time-submit-row {
    display: flex;
    gap: 3px;
    align-items: center;
    position: relative;
  }
  #noteTime {
    width: 60px;
    padding: 2px 4px;
    font-size: 11px;
    border: 1px solid #ccc;
    border-radius: 3px;
    outline-offset: 1px;
    cursor: text;
    user-select: text;
    box-sizing: border-box;
    text-align: center;
  }
  #submitBtn {
    flex: 1;
    padding: 3px 6px;
    font-size: 11px;
    background: #0000FF;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
    white-space: nowrap;
  }
  #submitBtn:hover { background: #0000CC; }
  #submitBtn.editing { background: #ffc107; color: #333; }
  #submitBtn.editing:hover { background: #e0a800; }

  .toolbar-row {
    display: flex;
    gap: 3px;
    align-items: center;
    position: relative;
    margin: 2px 0;
  }

  .toolbar-btn {
    padding: 2px 5px;
    font-size: 11px;
    background: #555;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .toolbar-btn:hover { background: #333; }

  #boldBtn {
    padding: 2px 6px;
    font-size: 11px;
    font-weight: bold;
    background: #666;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    user-select: none;
  }
  #boldBtn:hover { background: #444; }

  #fontSizeSelect {
    padding: 2px 2px;
    font-size: 11px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: white;
    color: #333;
    cursor: pointer;
  }

  .color-picker-wrapper {
    position: relative;
    display: inline-block;
  }
  .doc-color-btn {
    padding: 2px 5px;
    font-size: 11px;
    background: #f8f9fa;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    color: #333;
    line-height: 1.2;
  }
  .doc-color-btn:hover { background: #e9ecef; }

  /* 💡 調整色盤寬度以容納新加入的彩虹色彩 */
  .color-palette {
    display: none;
    position: absolute;
    top: 26px;
    left: 0;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    border-radius: 4px;
    padding: 6px;
    z-index: 100;
    width: 140px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .palette-color {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid #ddd;
    display: inline-block;
  }
  .palette-color:hover { transform: scale(1.15); border-color: #333; }

  #symbolPicker {
    display: none;
    position: absolute;
    top: 26px;
    left: 30px;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    border-radius: 4px;
    padding: 4px;
    z-index: 100;
    width: 180px;
    flex-wrap: wrap;
    gap: 3px;
  }
  .symbol-item {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    font-size: 12px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 3px;
    cursor: pointer;
    color: #333;
    user-select: none;
  }
  .symbol-item:hover {
    background: #0000FF;
    color: #fff;
    border-color: #0000FF;
  }

  #noteText {
    width: 100%;
    min-height: 40px;
    max-height: 70px;
    padding: 3px 6px;
    font-size: xx-small; 
    border: 1px solid #ccc;
    border-radius: 3px;
    background: white;
    color: black;
    overflow-y: auto;
    box-sizing: border-box;
    outline: none;
    cursor: text;
    user-select: text;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #noteText:empty:before {
    content: attr(placeholder);
    color: #999;
    font-size: 10.5px;
  }

  #notes {
    flex: 1;
    overflow-y: auto;
    font-size: 10.5px;
    background: white;
    color: black;
    border-radius: 3px;
    padding: 3px;
    user-select: text;
    cursor: default;
  }

  #notes div.note {
    position: relative;
    display: flex;
    align-items: flex-start;
    border-bottom: 1px solid #eee;
    padding: 4px 0;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  #notes div.note:hover { background-color: #f2f2f2; }
  
  #notes div.note .time {
    flex-shrink: 0;
    width: 46px;
    background-color: #e9e9e9;
    color: #555;
    text-align: center;
    font-weight: 600;
    font-size: 10px;
    border-radius: 2px;
    padding: 1px 2px;
    margin-right: 4px;
    z-index: 1;
  }
  
  #notes div.note .text {
    flex-grow: 1;
    padding-right: 35px;
    white-space: pre; 
    overflow: hidden;
    line-height: 1.3;
  }
  #notes div.note:hover .text {
    overflow: visible;
    white-space: pre-wrap;
    word-break: break-all;
    background: #fff;
    z-index: 2;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .note-actions {
    position: absolute;
    right: 2px;
    top: 2px;
    display: flex;
    gap: 2px;
    opacity: 0.3;
    transition: opacity 0.2s ease;
    z-index: 3;
    background: rgba(255,255,255,0.8);
    padding: 1px;
    border-radius: 2px;
  }
  #notes div.note:hover .note-actions {
    opacity: 1;
  }

  .note-action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 10px;
    padding: 0 2px;
    user-select: none;
  }
  .link-action-btn { color: #007bff; }
  .edit-action-btn { color: #0000FF; }
  .delete-action-btn { color: #d9534f; font-weight: bold; }
  .note-action-btn:hover { text-decoration: underline; }
  
  #saveLoadBtns {
    margin-top: 6px;
    margin-bottom: 4px;
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  #saveBtn, #loadBtn {
    width: 42%;
    padding: 3px 4px;
    font-size: 10.5px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
    color: white;
  }
  #saveBtn { background-color: #0000FF; }
  #saveBtn:hover { background-color: #0000CC; }
  #loadBtn { background-color: #6c757d; }
  #loadBtn:hover { background-color: #5a6268; }

  .corner-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    z-index: 20;
  }
  #handle-tl { top: 0; left: 0; cursor: nwse-resize; }
  #handle-tr { top: 0; right: 0; cursor: nesw-resize; }
  #handle-bl { bottom: 0; left: 0; cursor: nesw-resize; }
  #handle-br { bottom: 0; right: 0; cursor: nwse-resize; }
</style>
</head>
<body tabindex="0">

<input type="file" id="videoInput" accept="video/*" />
<video id="videoPlayer" autoplay controls></video>

<div id="notesContainer">
  <div class="corner-handle" id="handle-tl"></div>
  <div class="corner-handle" id="handle-tr"></div>
  <div class="corner-handle" id="handle-bl"></div>
  <div class="corner-handle" id="handle-br"></div>

  <form id="addNoteForm">
    <!-- 第一行：時間與新增按鈕 -->
    <div class="time-submit-row">
      <input type="text" id="noteTime" placeholder="時間" required />
      <button type="submit" id="submitBtn">新增筆記</button>
    </div>

    <!-- 第二行：顏色、超連結、符號、大小、粗體整合列 -->
    <div class="toolbar-row">
      <!-- 文字顏色 -->
      <div class="color-picker-wrapper">
        <button type="button" class="doc-color-btn" onmousedown="saveSelection(event)" onclick="togglePalette('textColorPalette', event)" title="文字顏色">A<span style="display:block; height:3px; background:#000; margin-top:1px;"></span></button>
        <div id="textColorPalette" class="color-palette"></div>
      </div>
      <!-- 醒目顯示顏色 -->
      <div class="color-picker-wrapper">
        <button type="button" class="doc-color-btn" onmousedown="saveSelection(event)" onclick="togglePalette('hiliteColorPalette', event)" title="醒目顯示顏色">🖍️</button>
        <div id="hiliteColorPalette" class="color-palette"></div>
      </div>

      <!-- 超連結 -->
      <button type="button" class="toolbar-btn" id="linkBtn" onmousedown="saveSelection(event)" onclick="insertLink()" title="插入超連結">🔗</button>

      <!-- 符號 -->
      <button type="button" class="toolbar-btn" id="symbolBtn" onmousedown="saveSelection(event)" onclick="toggleSymbolPicker(event)" title="插入符號">★</button>
      <div id="symbolPicker"></div>

      <!-- 字體大小 -->
      <select id="fontSizeSelect" onmousedown="saveSelection(event)" onchange="restoreSelection(); changeFontSize(this.value); this.value='';">
        <option value="" disabled selected>大小</option>
        <option value="1">極小 (1)</option>
        <option value="2">小 (2)</option>
        <option value="3">中 (3)</option>
        <option value="4">稍大 (4)</option>
        <option value="5">大 (5)</option>
        <option value="6">特大 (6)</option>
        <option value="7">最大 (7)</option>
      </select>

      <!-- 粗體 -->
      <button type="button" id="boldBtn" onmousedown="saveSelection(event)" onclick="toggleBold()" title="粗體"><b>B</b></button>
    </div>
    
    <div id="noteText" contenteditable="true" placeholder="筆記內容 (Enter新增，Shift+Enter換行)"></div>
  </form>

  <div id="notes"></div>

  <div id="saveLoadBtns">
    <button id="saveBtn" type="button" title="下載筆記">💾 下載筆記</button>
    <button id="loadBtn" type="button" title="載入筆記檔">📂 載入筆記</button>
  </div>
  <input type="file" id="loadNotesFile" style="display:none" accept=".json" />
</div>

<script>
const video = document.getElementById('videoPlayer');
const input = document.getElementById('videoInput');
const notesDiv = document.getElementById('notes');
const addNoteForm = document.getElementById('addNoteForm');
const noteTimeInput = document.getElementById('noteTime');
const noteTextInput = document.getElementById('noteText');
const submitBtn = document.getElementById('submitBtn');
const saveBtn = document.getElementById('saveBtn');
const loadBtn = document.getElementById('loadBtn');
const loadNotesFile = document.getElementById('loadNotesFile');
const notesContainer = document.getElementById('notesContainer');
const symbolPicker = document.getElementById('symbolPicker');

let notes = [];
let editingIndex = null;
let savedRange = null;

function saveSelection(e) {
  e.preventDefault();
  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    if (noteTextInput.contains(range.commonAncestorContainer)) {
      savedRange = range;
    }
  }
}

function restoreSelection() {
  if (savedRange) {
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(savedRange);
  }
}

/* 💡 更新後的色彩清單：深紅、紅、橘、黃、綠、青、淺藍、藍、紫、桃紅、黑、白 */
const colorList = [
  '#8B0000', '#FF0000', '#FFA500', '#FFFF00', '#00FF00', 
  '#00FFFF', '#4169E1', '#0000FF', '#8A2BE2', '#FF00FF', 
  '#000000', '#FFFFFF'
];

const textColorPalette = document.getElementById('textColorPalette');
colorList.forEach(c => {
  const span = document.createElement('span');
  span.className = 'palette-color';
  span.style.backgroundColor = c;
  span.onmousedown = (e) => e.preventDefault();
  span.onclick = (e) => {
    e.stopPropagation();
    restoreSelection();
    changeTextColor(c);
    textColorPalette.style.display = 'none';
  };
  textColorPalette.appendChild(span);
});

const hiliteColorPalette = document.getElementById('hiliteColorPalette');
colorList.forEach(c => {
  const span = document.createElement('span');
  span.className = 'palette-color';
  span.style.backgroundColor = c;
  span.onmousedown = (e) => e.preventDefault();
  span.onclick = (e) => {
    e.stopPropagation();
    restoreSelection();
    changeHiliteColor(c);
    hiliteColorPalette.style.display = 'none';
  };
  hiliteColorPalette.appendChild(span);
});

function togglePalette(paletteId, e) {
  e.stopPropagation();
  const palette = document.getElementById(paletteId);
  const isShow = palette.style.display === 'flex';
  document.querySelectorAll('.color-palette').forEach(p => p.style.display = 'none');
  symbolPicker.style.display = 'none';
  palette.style.display = isShow ? 'none' : 'flex';
}

const symbols = ['⮕', '【', '】', '｢', '｣', '①', '②', '③', '④', '⑤', '⑴', '⑵', '⑶', '⑷', '⑸', '㈠', '㈡', '㈢', '㈣', '㈤'];

symbols.forEach(sym => {
  const span = document.createElement('span');
  span.className = 'symbol-item';
  span.textContent = sym;
  span.onmousedown = (e) => e.preventDefault();
  span.onclick = (e) => {
    e.stopPropagation();
    restoreSelection();
    insertSymbol(sym);
    symbolPicker.style.display = 'none';
  };
  symbolPicker.appendChild(span);
});

function toggleSymbolPicker(e) {
  e.stopPropagation();
  const isShow = symbolPicker.style.display === 'flex';
  document.querySelectorAll('.color-palette').forEach(p => p.style.display = 'none');
  symbolPicker.style.display = isShow ? 'none' : 'flex';
}

function insertSymbol(sym) {
  noteTextInput.focus();
  document.execCommand('insertText', false, sym);
}

function insertLink() {
  restoreSelection();
  const url = prompt("請輸入超連結網址 (例如 https://example.com):");
  if (!url) return;
  noteTextInput.focus();
  
  const a = document.createElement('a');
  a.href = url.startsWith('http') ? url : 'https://' + url;
  a.target = '_blank';
  a.textContent = '🔗';
  a.title = a.href;
  a.style.color = '#007bff';
  a.style.textDecoration = 'underline';
  a.style.cursor = 'pointer';

  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(a);
    range.setStartAfter(a);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  } else {
    noteTextInput.appendChild(a);
  }
}

document.addEventListener('click', () => {
  symbolPicker.style.display = 'none';
  document.querySelectorAll('.color-palette').forEach(p => p.style.display = 'none');
});

function changeTextColor(color) {
  noteTextInput.focus();
  document.execCommand('foreColor', false, color);
}

function changeHiliteColor(color) {
  noteTextInput.focus();
  document.execCommand('hiliteColor', false, color);
}

function toggleBold() {
  restoreSelection();
  noteTextInput.focus();
  document.execCommand('bold', false, null);
}

function changeFontSize(size) {
  if (!size) return;
  restoreSelection();
  noteTextInput.focus();
  document.execCommand('fontSize', false, size);
}

function renderNotes() {
  notesDiv.innerHTML = "";
  notes.sort((a,b) => a.time - b.time);
  notes.forEach((note, idx) => {
    const div = document.createElement('div');
    div.className = "note";

    div.onclick = (e) => {
      if (e.target.closest('.note-actions') || e.target.tagName === 'A') return;
      video.currentTime = note.time;
      video.play();
    };

    const timeDiv = document.createElement('div');
    timeDiv.className = "time";
    timeDiv.textContent = formatTime(note.time);

    const textDiv = document.createElement('div');
    textDiv.className = "text";
    textDiv.innerHTML = note.text;
    textDiv.title = note.text.replace(/<[^>]*>/g, '');

    const actionsDiv = document.createElement('div');
    actionsDiv.className = "note-actions";

    const tempDom = document.createElement('div');
    tempDom.innerHTML = note.text;
    const firstLink = tempDom.querySelector('a');

    if (firstLink) {
      const linkBtn = document.createElement('button');
      linkBtn.className = "note-action-btn link-action-btn";
      linkBtn.title = "開啟網址: " + firstLink.href;
      linkBtn.textContent = "🔗";
      linkBtn.onclick = (e) => {
        e.stopPropagation();
        window.open(firstLink.href, '_blank');
      };
      actionsDiv.appendChild(linkBtn);
    }

    const editBtn = document.createElement('button');
    editBtn.className = "note-action-btn edit-action-btn";
    editBtn.title = "修改筆記";
    editBtn.textContent = "✏️";
    editBtn.onclick = (e) => {
      e.stopPropagation();
      noteTimeInput.value = formatTime(note.time);
      noteTextInput.innerHTML = note.text;
      editingIndex = idx;
      submitBtn.textContent = "💾 儲存修改";
      submitBtn.classList.add("editing");
      noteTextInput.focus();
    };

    const delBtn = document.createElement('button');
    delBtn.className = "note-action-btn delete-action-btn";
    delBtn.title = "刪除筆記";
    delBtn.textContent = "✖";
    delBtn.onclick = (e) => {
      e.stopPropagation();
      if(confirm("確定要刪除此筆記？")) {
        notes.splice(idx, 1);
        if (editingIndex === idx) {
          resetForm();
        }
        renderNotes();
      }
    };

    actionsDiv.appendChild(editBtn);
    actionsDiv.appendChild(delBtn);

    div.appendChild(timeDiv);
    div.appendChild(textDiv);
    div.appendChild(actionsDiv);
    notesDiv.appendChild(div);
  });
}

function resetForm() {
  editingIndex = null;
  noteTimeInput.value = "";
  noteTextInput.innerHTML = "";
  submitBtn.textContent = "新增筆記";
  submitBtn.classList.remove("editing");
  document.execCommand('fontSize', false, '1');
}

function formatTime(sec) {
  let h = Math.floor(sec / 3600);
  let m = Math.floor((sec % 3600) / 60);
  let s = Math.floor(sec % 60);
  if(h > 0){
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  } else {
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }
}

function parseTime(input) {
  input = input.trim();
  if(/^\d+$/.test(input)) return parseInt(input, 10);
  let parts = input.split(':').map(p => parseInt(p,10));
  if(parts.length === 2) return parts[0]*60 + parts[1];
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return NaN;
}

function handleFormSubmit() {
  const t = parseTime(noteTimeInput.value);
  if(isNaN(t) || t < 0 || t > video.duration) {
    alert("請輸入有效的時間 (秒/mm:ss/hh:mm:ss)，且不得超過影片長度");
    return;
  }
  const text = noteTextInput.innerHTML.trim();
  if(text.length === 0 || text === "<br>") {
    alert("請輸入筆記內容");
    return;
  }

  if (editingIndex !== null) {
    notes[editingIndex] = {time: t, text};
  } else {
    notes.push({time: t, text});
  }

  renderNotes();
  resetForm();
}

addNoteForm.onsubmit = (e) => {
  e.preventDefault();
  handleFormSubmit();
};

noteTextInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (e.shiftKey) {
      return;
    } else {
      e.preventDefault();
      handleFormSubmit();
    }
  }
});

saveBtn.onclick = () => {
  const dataStr = JSON.stringify(notes, null, 2);
  const blob = new Blob([dataStr], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'video_notes.json';
  a.click();
  URL.revokeObjectURL(url);
};

loadBtn.onclick = () => {
  loadNotesFile.click();
};

loadNotesFile.addEventListener('change', () => {
  if(loadNotesFile.files.length > 0){
    const file = loadNotesFile.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const loadedNotes = JSON.parse(e.target.result);
        if(Array.isArray(loadedNotes)){
          notes = loadedNotes.filter(n => typeof n.time === 'number' && typeof n.text === 'string');
          renderNotes();
        } else {
          alert("載入筆記格式錯誤");
        }
      } catch(e) {
        alert("載入筆記失敗: " + e.message);
      }
    }
    reader.readAsText(file);
  }
});

input.addEventListener('change', e => {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  video.play();
  document.body.focus();
});

window.addEventListener('keydown', e => {
  const activeEl = document.activeElement;
  
  if (e.key === 'Escape') {
    if (activeEl) activeEl.blur();
    return;
  }

  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.id === 'noteText')) {
    return;
  }

  if(['ArrowLeft','ArrowRight',' ','f'].includes(e.key)) {
    e.preventDefault();
  }

  switch(e.key){
    case 'ArrowLeft':
      video.currentTime = Math.max(0, video.currentTime - 3);
      break;
    case 'ArrowRight':
      video.currentTime = Math.min(video.duration, video.currentTime + 3);
      break;
    case ' ':
      if(video.paused) video.play();
      else video.pause();
      break;
    case 'f':
      if(document.fullscreenElement) document.exitFullscreen();
      else video.requestFullscreen();
      break;
  }
});

video.addEventListener('click', () => {
  if (document.activeElement) {
    document.activeElement.blur();
  }
  const current = Math.floor(video.currentTime);
  noteTimeInput.value = formatTime(current);
});

let isDragging = false;
let currentResizeCorner = null;
let startX = 0, startY = 0;
let startLeft = 0, startTop = 0;
let startWidth = 0, startHeight = 0;

notesContainer.addEventListener('mousedown', (e) => {
  const isInteractive = e.target.closest('#addNoteForm') || 
                        e.target.closest('#notes div.note') || 
                        e.target.closest('#saveLoadBtns') ||
                        e.target.closest('#symbolPicker') ||
                        e.target.closest('.color-palette');

  if (isInteractive) return;

  if (e.target.classList.contains('corner-handle')) {
    currentResizeCorner = e.target.id;
    startX = e.clientX;
    startY = e.clientY;
    startWidth = notesContainer.offsetWidth;
    startHeight = notesContainer.offsetHeight;
    const style = window.getComputedStyle(notesContainer);
    startLeft = parseInt(style.left, 10) || 0;
    startTop = parseInt(style.top, 10) || 0;
    e.preventDefault();
    return;
  }

  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  const style = window.getComputedStyle(notesContainer);
  startLeft = parseInt(style.left, 10) || 0;
  startTop = parseInt(style.top, 10) || 0;
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    let deltaX = e.clientX - startX;
    let deltaY = e.clientY - startY;

    let newLeft = startLeft + deltaX;
    let newTop = startTop + deltaY;

    const maxTop = window.innerHeight - notesContainer.offsetHeight;
    newTop = Math.min(newTop, maxTop);

    notesContainer.style.left = newLeft + 'px';
    notesContainer.style.top = newTop + 'px';

  } else if (currentResizeCorner) {
    let deltaX = e.clientX - startX;
    let deltaY = e.clientY - startY;

    let newWidth = startWidth;
    let newHeight = startHeight;
    let newLeft = startLeft;
    let newTop = startTop;

    if (currentResizeCorner === 'handle-br') {
      newWidth = Math.max(240, startWidth + deltaX);
      newHeight = Math.max(250, startHeight + deltaY);
    } else if (currentResizeCorner === 'handle-bl') {
      newWidth = Math.max(240, startWidth - deltaX);
      newHeight = Math.max(250, startHeight + deltaY);
      newLeft = startLeft + (startWidth - newWidth);
    } else if (currentResizeCorner === 'handle-tr') {
      newWidth = Math.max(240, startWidth + deltaX);
      newHeight = Math.max(250, startHeight - deltaY);
      newTop = startTop + (startHeight - newHeight);
    } else if (currentResizeCorner === 'handle-tl') {
      newWidth = Math.max(240, startWidth - deltaX);
      newHeight = Math.max(250, startHeight - deltaY);
      newLeft = startLeft + (startWidth - newWidth);
      newTop = startTop + (startHeight - newHeight);
    }

    notesContainer.style.width = newWidth + 'px';
    notesContainer.style.height = newHeight + 'px';
    notesContainer.style.left = newLeft + 'px';
    notesContainer.style.top = newTop + 'px';
  }
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  currentResizeCorner = null;
});

window.addEventListener('DOMContentLoaded', () => {
  noteTextInput.focus();
  document.execCommand('fontSize', false, '1');
});

renderNotes();
</script>
</body>
</html>
