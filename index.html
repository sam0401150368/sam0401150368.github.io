<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>影片播放器 + 右側筆記 (按鈕微調最終版)</title>
<style>
  html, body {
    margin:0; padding:0; height:100%; background:black;
    overflow: hidden;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    color: white;
  }
  #videoPlayer {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
    z-index: 0;
    display: block;
  }
  input[type="file"] {
    position: fixed; top: 10px; left: 10px; z-index: 100;
  }
  #notesContainer {
    position: fixed;
    top: 0;
    left: calc(100vw - 340px);
    width: 340px;
    height: calc(100vh - 40px);
    background: rgba(255,255,255,0.92);
    color: #333;
    display: flex;
    flex-direction: column;
    padding: 8px 12px;
    box-sizing: border-box;
    box-shadow: -3px 0 10px rgba(0,0,0,0.5);
    z-index: 10;
    overflow: visible;
    min-width: 240px;
    min-height: 250px;
  }
  
  #addNoteForm {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 3px;
  }
  .time-submit-row {
    display: flex;
    gap: 3px;
    align-items: center;
    position: relative;
  }
  #noteTime {
    width: 60px;
    padding: 2px 4px;
    font-size: 11px;
    border: 1px solid #ccc;
    border-radius: 3px;
    outline-offset: 1px;
    cursor: text;
    user-select: text;
    box-sizing: border-box;
    text-align: center;
  }
  #submitBtn {
    flex: 1;
    padding: 3px 6px;
    font-size: 11px;
    background: #0000FF;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
    white-space: nowrap;
  }
  #submitBtn:hover { background: #0000CC; }
  #submitBtn.editing { background: #ffc107; color: #333; }
  #submitBtn.editing:hover { background: #e0a800; }

  .toolbar-row {
    display: flex;
    gap: 3px;
    align-items: center;
    position: relative;
    margin: 2px 0;
    flex-wrap: wrap;
  }

  .toolbar-btn {
    padding: 2px 5px;
    font-size: 11px;
    background: #555;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .toolbar-btn:hover { background: #333; }

  #boldBtn {
    padding: 2px 6px;
    font-size: 11px;
    font-weight: bold;
    background: #666;
    border: none;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  #boldBtn:hover { background: #444; }
  #boldBtn.active {
    background: #cce0ff;
    color: #004085;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    border: 1px solid #b8daff;
  }

  .custom-icon-btn {
    padding: 1px 3px;
    background: #f8f9fa;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .custom-icon-btn:hover { background: #e9ecef; border-color: #999; }
  .custom-icon-btn img {
    width: 11px !important;
    height: 11px !important;
    object-fit: contain;
    vertical-align: middle;
  }

  .font-size-wrapper {
    position: relative;
    display: inline-block;
  }
  .font-size-btn {
    padding: 2px 6px;
    font-size: 11px;
    background: #f8f9fa;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
    color: #333;
    font-weight: bold;
    user-select: none;
  }
  .font-size-btn:hover { background: #e9ecef; }

  .font-size-dropdown {
    display: none;
    position: absolute;
    top: 26px;
    left: 0;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    border-radius: 4px;
    padding: 3px 0;
    z-index: 100;
    width: 85px;
  }
  .font-size-item {
    padding: 4px 8px;
    font-size: 11px;
    color: #333;
    cursor: pointer;
    text-align: left;
    user-select: none;
  }
  .font-size-item:hover {
    background: #0000FF;
    color: #fff;
  }

  .color-quick-row {
    display: flex;
    gap: 3px;
    align-items: center;
    background: #f1f3f5;
    padding: 2px 4px;
    border-radius: 3px;
    border: 1px solid #ddd;
    margin: 2px 0;
    position: relative;
    flex-wrap: wrap;
  }
  .color-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid #bbb;
    display: inline-block;
    transition: transform 0.1s ease;
  }
  .color-dot:hover { transform: scale(1.25); border-color: #333; }

  .color-picker-wrapper {
    position: relative;
    display: inline-block;
  }
  .doc-color-btn {
    padding: 2px 5px;
    font-size: 11px;
    background: #f8f9fa;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
    color: #333;
    line-height: 1.2;
  }
  .doc-color-btn:hover { background: #e9ecef; }

  .color-palette {
    display: none;
    position: absolute;
    top: 26px;
    left: 0;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    border-radius: 4px;
    padding: 6px;
    z-index: 100;
    width: 140px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .palette-color {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    cursor: pointer;
    border: 1px solid #ddd;
    display: inline-block;
  }
  .palette-color:hover { transform: scale(1.15); border-color: #333; }

  #symbolPicker {
    display: none;
    position: absolute;
    top: 26px;
    left: 0;
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    border-radius: 4px;
    padding: 4px;
    z-index: 100;
    width: 125px;
    flex-wrap: wrap;
    gap: 3px;
  }
  .symbol-item {
    display: inline-block;
    width: 21px;
    height: 21px;
    line-height: 21px;
    text-align: center;
    font-size: 12px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 3px;
    cursor: pointer;
    color: #333;
    user-select: none;
  }
  .symbol-item:hover {
    background: #0000FF;
    color: #fff;
    border-color: #0000FF;
  }

  #noteText {
    width: 100%;
    min-height: 40px;
    max-height: 70px;
    padding: 3px 6px;
    font-size: 11px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background: white;
    color: black;
    overflow-y: auto;
    box-sizing: border-box;
    outline: none;
    cursor: text;
    user-select: text;
    white-space: pre-wrap;
    word-break: break-all;
  }
  
  #noteText font[size="1"], #notes font[size="1"] { font-size: 11px !important; }
  #noteText font[size="2"], #notes font[size="2"] { font-size: 13px !important; }
  #noteText font[size="3"], #notes font[size="3"] { font-size: 15px !important; }
  #noteText font[size="4"], #notes font[size="4"] { font-size: 17px !important; }
  #noteText font[size="5"], #notes font[size="5"] { font-size: 20px !important; }
  #noteText font[size="6"], #notes font[size="6"] { font-size: 24px !important; }
  #noteText font[size="7"], #notes font[size="7"] { font-size: 30px !important; }
  
  #noteText .img-badge {
    background: #e9ecef;
    border: 1px solid #ced4da;
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 10px;
    color: #495057;
    display: inline-block;
    margin: 0 2px;
    user-select: none;
  }

  #noteText:empty:before {
    content: attr(placeholder);
    color: #999;
    font-size: 11px;
  }

  #notes {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    background: white;
    color: black;
    border-radius: 3px;
    padding: 3px;
    user-select: text;
    cursor: default;
  }

  #notes div.note {
    position: relative;
    display: flex;
    align-items: flex-start;
    border-bottom: 1px solid #eee;
    padding: 4px 0;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  #notes div.note:hover { background-color: #f2f2f2; }
  
  #notes div.note .left-col {
    flex-shrink: 0;
    width: 46px;
    margin-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 2;
  }
  
  #notes div.note .time {
    background-color: #e9e9e9;
    color: #555;
    text-align: center;
    font-weight: 600;
    font-size: 10px;
    border-radius: 2px;
    padding: 1px 2px;
  }

  .img-zoom-controls {
    display: flex;
    gap: 2px;
    justify-content: center;
  }
  .zoom-btn {
    background: #f8f9fa;
    border: 1px solid #ccc;
    color: #333;
    font-size: 10px;
    font-weight: bold;
    width: 20px;
    height: 16px;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    border-radius: 2px;
    padding: 0;
  }
  .zoom-btn:hover { background: #0000FF; color: #fff; border-color: #0000FF; }

  .preview-btn {
    background: #f8f9fa;
    border: 1px solid #ccc;
    color: #333;
    font-size: 10px;
    width: 100%;
    height: 16px;
    line-height: 14px;
    text-align: center;
    cursor: pointer;
    border-radius: 2px;
    padding: 0;
  }
  .preview-btn:hover { background: #28a745; color: #fff; border-color: #28a745; }
  
  #notes div.note .text {
    flex-grow: 1;
    padding-right: 35px;
    white-space: pre; 
    overflow: hidden;
    line-height: 1.3;
  }
  
  img.custom-icon-img {
    width: 11px !important;
    height: 11px !important;
    max-width: 11px !important;
    max-height: 11px !important;
    vertical-align: -1px !important;
    margin: 0 1px !important;
    display: inline-block !important;
    object-fit: contain !important;
  }

  .note-img-wrapper {
    position: relative;
    display: inline-block;
    margin: 2px 0;
  }
  .note-img-wrapper img {
    max-width: 100% !important;
    max-height: 22vh !important;
    width: auto !important;
    height: auto !important;
    vertical-align: middle;
    display: block;
    transition: transform 0.1s ease;
    transform-origin: top left;
  }

  .note-actions {
    position: absolute;
    right: 2px;
    top: 2px;
    display: flex;
    gap: 2px;
    opacity: 0.3;
    transition: opacity 0.2s ease;
    z-index: 15;
    background: rgba(255,255,255,0.9);
    padding: 1px;
    border-radius: 2px;
  }
  #notes div.note:hover .note-actions {
    opacity: 1;
  }
  
  #notes div.note .text:hover,
  #notes div.note:has(.note-actions:hover) .text {
    overflow: visible;
    white-space: pre-wrap;
    word-break: break-all;
    background: #fff;
    z-index: 8;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .note-action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 10px;
    padding: 0 2px;
    user-select: none;
  }
  .link-action-btn { color: #007bff; }
  .edit-action-btn { color: #0000FF; }
  .delete-action-btn { color: #d9534f; font-weight: bold; }
  .note-action-btn:hover { text-decoration: underline; }
  
  #saveLoadBtns {
    margin-top: 6px;
    margin-bottom: 4px;
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  #saveBtn, #loadBtn {
    width: 42%;
    padding: 3px 4px;
    font-size: 10.5px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease;
    color: white;
  }
  #saveBtn { background-color: #0000FF; }
  #saveBtn:hover { background-color: #0000CC; }
  #loadBtn { background-color: #6c757d; }
  #loadBtn:hover { background-color: #5a6268; }

  #imageModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0, 0, 0, 0.88);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #imageModal img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    transition: transform 0.05s ease-out;
    cursor: grab;
    user-select: none;
    position: relative;
  }
  #imageModal img:active {
    cursor: grabbing;
  }

  .corner-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    z-index: 20;
  }
  #handle-tl { top: 0; left: 0; cursor: nwse-resize; }
  #handle-tr { top: 0; right: 0; cursor: nesw-resize; }
  #handle-bl { bottom: 0; left: 0; cursor: nesw-resize; }
  #handle-br { bottom: 0; right: 0; cursor: nwse-resize; }
</style>
</head>
<body tabindex="0">

<input type="file" id="videoInput" accept="video/*" />
<video id="videoPlayer" autoplay controls></video>

<div id="imageModal" onclick="closeImageModal()">
  <img id="modalImg" src="" alt="預覽大圖" onclick="event.stopPropagation()" />
</div>

<div id="notesContainer">
  <div class="corner-handle" id="handle-tl"></div>
  <div class="corner-handle" id="handle-tr"></div>
  <div class="corner-handle" id="handle-bl"></div>
  <div class="corner-handle" id="handle-br"></div>

  <form id="addNoteForm">
    <div class="time-submit-row">
      <input type="text" id="noteTime" placeholder="時間" required />
      <button type="submit" id="submitBtn">新增筆記</button>

      <!-- 輸入框專用復原/取消復原 -->
      <button type="button" class="toolbar-btn" id="undoBtn" onmousedown="saveSelection(event)" onclick="handleInputUndo()" title="復原輸入 (Undo)">↩️</button>
      <button type="button" class="toolbar-btn" id="redoBtn" onmousedown="saveSelection(event)" onclick="handleInputRedo()" title="取消復原輸入 (Redo)">↪️</button>

      <div class="font-size-wrapper">
        <button type="button" class="font-size-btn" onmousedown="saveSelection(event)" onclick="toggleFontSizeDropdown(event)">大小 ▾</button>
        <div id="fontSizeDropdown" class="font-size-dropdown">
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('1')">極小 (1)</div>
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('2')">小 (2)</div>
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('3')">中 (3)</div>
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('4')">稍大 (4)</div>
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('5')">大 (5)</div>
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('6')">特大 (6)</div>
          <div class="font-size-item" onmousedown="event.preventDefault()" onclick="applyFontSize('7')">最大 (7)</div>
        </div>
      </div>

      <button type="button" class="toolbar-btn" id="linkBtn" onmousedown="saveSelection(event)" onclick="insertLink()" title="插入超連結">🔗</button>
      <button type="button" class="toolbar-btn" id="imgBtn" onmousedown="saveSelection(event)" onclick="insertImageBadge()" title="插入圖片網址">📷</button>
    </div>

    <!-- 上方工具列 (已將 插入符號 與 醒目提醒顏色 移至 申 的右邊) -->
    <div class="toolbar-row">
      <button type="button" id="boldBtn" onmousedown="saveSelection(event)" onclick="toggleBold()" title="粗體"><b>B</b></button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('§')" title="插入 §">§</button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('【')" title="插入 【">【</button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('】')" title="插入 】">】</button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('⭐')" title="插入 ⭐">⭐</button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('⮕')" title="插入 ⮕">⮕</button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('⭕')" title="插入 ⭕">⭕</button>
      <button type="button" class="toolbar-btn" onmousedown="saveSelection(event)" onclick="insertDirectSymbol('❌')" title="插入 ❌">❌</button>
      <button type="button" class="custom-icon-btn" onmousedown="saveSelection(event)" onclick="insertCustomImage('xuan')" title="插入選圖示">
        <img class="custom-icon-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='red' stroke-width='8'/><text x='50' y='72' font-size='52' font-weight='bold' text-anchor='middle' fill='red'>選</text></svg>" alt="選">
      </button>
      <button type="button" class="custom-icon-btn" onmousedown="saveSelection(event)" onclick="insertCustomImage('shen')" title="插入申圖示">
        <img class="custom-icon-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='red' stroke-width='8'/><text x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='black'>申</text></svg>" alt="申">
      </button>

      <!-- 插入符號 與 醒目提醒顏色 移至此處 -->
      <button type="button" class="toolbar-btn" id="symbolBtn" onmousedown="saveSelection(event)" onclick="toggleSymbolPicker(event)" title="插入符號">★</button>
      <div id="symbolPicker"></div>

      <div class="color-picker-wrapper">
        <button type="button" class="doc-color-btn" onmousedown="saveSelection(event)" onclick="togglePalette('hiliteColorPalette', event)" title="醒目顯示顏色">🖍️</button>
        <div id="hiliteColorPalette" class="color-palette"></div>
      </div>
    </div>

    <!-- 下方顏色排 (已去除「顏色:」二字，並在灰色後面放上下方筆記專用的復原與取消復原按鈕) -->
    <div class="color-quick-row">
      <span class="color-dot" style="background:#000000;" onmousedown="saveSelection(event)" onclick="changeTextColor('#000000')" title="黑色"></span>
      <span class="color-dot" style="background:#FF0000;" onmousedown="saveSelection(event)" onclick="changeTextColor('#FF0000')" title="紅色"></span>
      <span class="color-dot" style="background:#8A2BE2;" onmousedown="saveSelection(event)" onclick="changeTextColor('#8A2BE2')" title="紫色"></span>
      <span class="color-dot" style="background:#0000FF;" onmousedown="saveSelection(event)" onclick="changeTextColor('#0000FF')" title="藍色"></span>
      <span class="color-dot" style="background:#FFA500;" onmousedown="saveSelection(event)" onclick="changeTextColor('#FFA500')" title="橘色"></span>
      <span class="color-dot" style="background:#8B4513;" onmousedown="saveSelection(event)" onclick="changeTextColor('#8B4513')" title="咖啡色"></span>
      <span class="color-dot" style="background:#00FF00;" onmousedown="saveSelection(event)" onclick="changeTextColor('#00FF00')" title="綠色"></span>
      <span class="color-dot" style="background:#00FFFF;" onmousedown="saveSelection(event)" onclick="changeTextColor('#00FFFF')" title="青色"></span>
      <span class="color-dot" style="background:#FF00FF;" onmousedown="saveSelection(event)" onclick="changeTextColor('#FF00FF')" title="粉紅"></span>
      <span class="color-dot" style="background:#808080;" onmousedown="saveSelection(event)" onclick="changeTextColor('#808080')" title="灰色"></span>
      
      <!-- 下方筆記區專屬的復原與取消復原按鈕 (移至顏色後面) -->
      <button type="button" class="toolbar-btn" onclick="handleListUndo()" title="復原下方筆記列表變更" style="font-size:9.5px; padding:1px 4px; background:#444;">↩️筆記復原</button>
      <button type="button" class="toolbar-btn" onclick="handleListRedo()" title="取消復原下方筆記列表變更" style="font-size:9.5px; padding:1px 4px; background:#444;">↪️取消</button>
    </div>
    
    <div id="noteText" contenteditable="true" placeholder="筆記內容 (可點 📷 插入圖片)"></div>
  </form>

  <div id="notes"></div>

  <div id="saveLoadBtns">
    <button id="saveBtn" type="button" title="下載筆記">💾 下載筆記</button>
    <button id="loadBtn" type="button" title="載入筆記檔">📂 載入筆記</button>
  </div>
  <input type="file" id="loadNotesFile" style="display:none" accept=".json" />
</div>

<script>
const video = document.getElementById('videoPlayer');
const input = document.getElementById('videoInput');
const notesDiv = document.getElementById('notes');
const addNoteForm = document.getElementById('addNoteForm');
const noteTimeInput = document.getElementById('noteTime');
const noteTextInput = document.getElementById('noteText');
const submitBtn = document.getElementById('submitBtn');
const saveBtn = document.getElementById('saveBtn');
const loadBtn = document.getElementById('loadBtn');
const loadNotesFile = document.getElementById('loadNotesFile');
const notesContainer = document.getElementById('notesContainer');
const symbolPicker = document.getElementById('symbolPicker');
const fontSizeDropdown = document.getElementById('fontSizeDropdown');
const boldBtn = document.getElementById('boldBtn');

const imageModal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImg');

let notes = [];
let editingIndex = null;
let savedRange = null;

let textInputHistory = [];
let textInputRedo = [];
let lastInputHtml = "";

function recordTextInputState() {
  const currentHtml = noteTextInput.innerHTML;
  if (currentHtml !== lastInputHtml) {
    textInputHistory.push(lastInputHtml);
    if (textInputHistory.length > 50) textInputHistory.shift();
    textInputRedo = [];
    lastInputHtml = currentHtml;
  }
}

function handleInputUndo() {
  if (textInputHistory.length > 0) {
    textInputRedo.push(noteTextInput.innerHTML);
    const prevHtml = textInputHistory.pop();
    noteTextInput.innerHTML = prevHtml;
    lastInputHtml = prevHtml;
    updateBoldButtonState();
  }
}

function handleInputRedo() {
  if (textInputRedo.length > 0) {
    textInputHistory.push(noteTextInput.innerHTML);
    const nextHtml = textInputRedo.pop();
    noteTextInput.innerHTML = nextHtml;
    lastInputHtml = nextHtml;
    updateBoldButtonState();
  }
}

let notesListHistory = [];
let notesListRedo = [];

function saveNotesListState() {
  const currentState = JSON.parse(JSON.stringify(notes));
  if (notesListHistory.length === 0 || JSON.stringify(notesListHistory[notesListHistory.length - 1]) !== JSON.stringify(currentState)) {
    notesListHistory.push(currentState);
    if (notesListHistory.length > 50) notesListHistory.shift();
    notesListRedo = [];
  }
}

function handleListUndo() {
  if (notesListHistory.length > 1) {
    notesListRedo.push(JSON.parse(JSON.stringify(notes)));
    notesListHistory.pop(); 
    const previousState = notesListHistory[notesListHistory.length - 1];
    notes = JSON.parse(JSON.stringify(previousState));
    renderNotes();
  } else if (notesListHistory.length === 1) {
    notesListRedo.push(JSON.parse(JSON.stringify(notes)));
    notesListHistory.pop();
    notes = [];
    renderNotes();
  } else {
    alert("已經是最早的筆記狀態了！");
  }
}

function handleListRedo() {
  if (notesListRedo.length > 0) {
    notesListHistory.push(JSON.parse(JSON.stringify(notes)));
    const nextState = notesListRedo.pop();
    notes = JSON.parse(JSON.stringify(nextState));
    renderNotes();
  } else {
    alert("沒有可取消復原的筆記狀態！");
  }
}

let currentModalScale = 1;
let modalTranslateX = 0;
let modalTranslateY = 0;
let isDraggingModal = false;
let startDragX = 0;
let startDragY = 0;

function saveSelection(e) {
  e.preventDefault();
  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    if (noteTextInput.contains(range.commonAncestorContainer)) {
      savedRange = range;
    }
  }
}

function restoreSelection() {
  if (savedRange) {
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(savedRange);
  }
}

function toggleFontSizeDropdown(e) {
  e.stopPropagation();
  const isShow = fontSizeDropdown.style.display === 'block';
  closeAllPopups();
  fontSizeDropdown.style.display = isShow ? 'none' : 'block';
}

function applyFontSize(size) {
  recordTextInputState();
  restoreSelection();
  noteTextInput.focus();
  document.execCommand('fontSize', false, size);
  fontSizeDropdown.style.display = 'none';
  recordTextInputState();
}

function closeAllPopups() {
  fontSizeDropdown.style.display = 'none';
  symbolPicker.style.display = 'none';
  document.querySelectorAll('.color-palette').forEach(p => p.style.display = 'none');
}

function insertDirectSymbol(sym) {

}

function insertCustomImage(type) {
  recordTextInputState();
  restoreSelection();
  noteTextInput.focus();
  
  const img = document.createElement('img');
  img.className = 'custom-icon-img';
  if (type === 'shen') {
    img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='red' stroke-width='8'/><text x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='black'>申</text></svg>";
  } else {
    img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='red' stroke-width='8'/><text x='50' y='72' font-size='52' font-weight='bold' text-anchor='middle' fill='red'>選</text></svg>";
  }

  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(img);
    range.setStartAfter(img);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  } else {
    noteTextInput.appendChild(img);
  }
  recordTextInputState();
}

function formatImageUrl(url) {
  url = url.trim();
  const imgurMatch = url.match(/(?:https?:\/\/)?(?:i\.)?imgur\.com\/([a-zA-Z0-9]+)(?:\.[a-zA-Z]+)?/);
  if (imgurMatch && imgurMatch[1] && !url.includes('i.imgur.com/')) {
    return `https://i.imgur.com/${imgurMatch[1]}.png`;
  }
  return url;
}

function insertImageBadge() {
  restoreSelection();
  let url = prompt("請輸入圖片網址 (Imgur 或一般圖片網址):");
  if (!url) return;
  
  recordTextInputState();
  const cleanUrl = formatImageUrl(url);
  noteTextInput.focus();

  const span = document.createElement('span');
  span.className = "img-badge";
  span.textContent = "📷 圖片";
  span.setAttribute("data-img-url", cleanUrl);
  span.title = url;
  span.contentEditable = "false";

  const space = document.createTextNode(" ");

  const selection = window.getSelection();
  if (selection.rangeCount > 0) {
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(space);
    range.insertNode(span);
    
    range.setStartAfter(space);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  } else {
    noteTextInput.appendChild(span);
    noteTextInput.appendChild(space);
  }
  recordTextInputState();
}

noteTextInput.addEventListener('input', () => {
  recordTextInputState();

});
noteTextInput.addEventListener('keyup', updateBoldButtonState);

function openImageModal(url) {
  currentModalScale = 1;
  modalTranslateX = 0;
  modalTranslateY = 0;
  updateModalTransform();
  modalImg.src = url;
  imageModal.style.display = 'flex';
}

function closeImageModal() {
  imageModal.style.display = 'none';
  modalImg.src = '';
}

function updateModalTransform() {
  modalImg.style.transform = `translate(${modalTranslateX}px, ${modalTranslateY}px) scale(${currentModalScale})`;
}

imageModal.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.deltaY < 0) {
    currentModalScale = Math.min(6, currentModalScale + 0.25);
  } else {
    currentModalScale = Math.max(0.5, currentModalScale - 0.25);
  }
  updateModalTransform();
});

modalImg.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isDraggingModal = true;
  startDragX = e.clientX - modalTranslateX;
  startDragY = e.clientY - modalTranslateY;
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (!isDraggingModal) return;
  modalTranslateX = e.clientX - startDragX;
  modalTranslateY = e.clientY - startDragY;
  updateModalTransform();
});

window.addEventListener('mouseup', () => {
  isDraggingModal = false;
});

function parseImageUrls(html) {
  const div = document.createElement('div');
  div.innerHTML = html;

  div.querySelectorAll('.img-badge').forEach(el => {
    const imgUrl = el.getAttribute('data-img-url');
    if (imgUrl) {
      const container = createImgContainer(imgUrl);
      el.parentNode.replaceChild(container, el);
    }
  });

  div.querySelectorAll('img').forEach(img => {
    const isSvgIcon = img.src.startsWith('data:image/svg+xml') || img.classList.contains('custom-icon-img');
    if (!isSvgIcon && !img.closest('.note-img-wrapper') && !img.closest('.custom-icon-btn')) {
      const imgUrl = formatImageUrl(img.src);
      const container = createImgContainer(imgUrl);
      img.parentNode.replaceChild(container, img);
    } else if (isSvgIcon) {
      img.className = 'custom-icon-img';
    }
  });

  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      let text = node.nodeValue;
      const urlRegex = /(https?:\/\/[^\s<]+)/gi;
      
      if (urlRegex.test(text)) {
        text = text.replace(urlRegex, (match) => {
          if (match.includes('imgur.com') || match.match(/\.(png|jpg|jpeg|gif|webp|svg)(\?[^\s]*)?$/i)) {
            const formatted = formatImageUrl(match);
            return `__IMG_PLACEHOLDER__${formatted}__IMG_PLACEHOLDER__`;
          }
          return match;
        });

        if (text !== node.nodeValue) {
          const span = document.createElement('span');
          span.innerHTML = text;
          node.parentNode.replaceChild(span, node);
        }
      }
    } else {
      for (let i = 0; i < node.childNodes.length; i++) {
        walk(node.childNodes[i]);
      }
    }
  }
  walk(div);

  let finalHtml = div.innerHTML;
  while (finalHtml.includes('__IMG_PLACEHOLDER__')) {
    const start = finalHtml.indexOf('__IMG_PLACEHOLDER__');
    const end = finalHtml.indexOf('__IMG_PLACEHOLDER__', start + 19);
    if (start !== -1 && end !== -1) {
      const url = finalHtml.substring(start + 19, end);
      const tempDiv = document.createElement('div');
      const container = createImgContainer(url);
      tempDiv.appendChild(container);
      finalHtml = finalHtml.substring(0, start) + tempDiv.innerHTML + finalHtml.substring(end + 19);
    } else {
      break;
    }
  }

  const resultDiv = document.createElement('div');
  resultDiv.innerHTML = finalHtml;
  return resultDiv.innerHTML;
}

function createImgContainer(url) {
  const wrapper = document.createElement('div');
  wrapper.style.margin = '2px 0';

  const imgWrapper = document.createElement('div');
  imgWrapper.className = 'note-img-wrapper';

  const img = document.createElement('img');
  img.src = url;

  let currentScale = 1;
  wrapper.dataset.zoom = 1;
  wrapper.zoomImage = (delta) => {
    currentScale = Math.max(0.5, Math.min(3, currentScale + delta));
    img.style.transform = `scale(${currentScale})`;
  };

  imgWrapper.appendChild(img);
  wrapper.appendChild(imgWrapper);

  return wrapper;
}

function renderNotes() {
  notesDiv.innerHTML = "";
  notes.sort((a,b) => a.time - b.time);
  notes.forEach((note, idx) => {
    const div = document.createElement('div');
    div.className = "note";

    div.onclick = (e) => {
      if (e.target.closest('.note-actions') || e.target.closest('.img-zoom-controls') || e.target.closest('.img-link-btn') || e.target.closest('.preview-btn') || e.target.closest('.note-img-wrapper') || e.target.tagName === 'A') return;
      const confirmJump = confirm(`是否要跳轉至影片時間 [${formatTime(note.time)}] 並播放？`);
      if (confirmJump) {
        video.currentTime = note.time;
        video.play();
      }
    };

    const leftCol = document.createElement('div');
    leftCol.className = "left-col";

    const timeDiv = document.createElement('div');
    timeDiv.className = "time";
    timeDiv.textContent = formatTime(note.time);
    leftCol.appendChild(timeDiv);

    const textDiv = document.createElement('div');
    textDiv.className = "text";
    textDiv.innerHTML = parseImageUrls(note.text);
    textDiv.title = note.text.replace(/<[^>]*>/g, '');

    const actionsDiv = document.createElement('div');
    actionsDiv.className = "note-actions";

    const tempDom = document.createElement('div');
    tempDom.innerHTML = note.text;
    const firstLink = tempDom.querySelector('a');

    if (firstLink) {
      const linkBtn = document.createElement('button');
      linkBtn.className = "note-action-btn link-action-btn";
      linkBtn.title = "開啟網址: " + firstLink.href;
      linkBtn.textContent = "🔗";
      linkBtn.onclick = (e) => {
        e.stopPropagation();
        window.open(firstLink.href, '_blank');
      };
      actionsDiv.appendChild(linkBtn);
    }

    const editBtn = document.createElement('button');
    editBtn.className = "note-action-btn edit-action-btn";
    editBtn.title = "修改筆記";
    editBtn.textContent = "✏️";
    editBtn.onclick = (e) => {
      e.stopPropagation();
      saveNotesListState();
      noteTimeInput.value = formatTime(note.time);
      noteTextInput.innerHTML = note.text;
      lastInputHtml = note.text;
      editingIndex = idx;
      submitBtn.textContent = "💾 儲存修改";
      submitBtn.classList.add("editing");
      noteTextInput.focus();
      updateBoldButtonState();
    };

    const delBtn = document.createElement('button');
    delBtn.className = "note-action-btn delete-action-btn";
    delBtn.title = "刪除筆記";
    delBtn.textContent = "✖";
    delBtn.onclick = (e) => {
      e.stopPropagation();
      if(confirm("確定要刪除此筆記？")) {
        saveNotesListState();
        notes.splice(idx, 1);
        if (editingIndex === idx) {
          resetForm();
        }
        renderNotes();
        saveNotesListState();
      }
    };

    actionsDiv.appendChild(editBtn);
    actionsDiv.appendChild(delBtn);

    const realImages = Array.from(textDiv.querySelectorAll('.note-img-wrapper img')).filter(img => !img.classList.contains('custom-icon-img'));
    if (realImages.length > 0) {
      const firstImg = realImages[0];
      const imgLinkBtn = document.createElement('button');
      imgLinkBtn.className = "note-action-btn img-link-btn";
      imgLinkBtn.title = "在新視窗檢視原圖";
      imgLinkBtn.textContent = "🔗";
      imgLinkBtn.onclick = (e) => {
        e.stopPropagation();
        window.open(firstImg.src, '_blank');
      };
      actionsDiv.insertBefore(imgLinkBtn, editBtn);

      const zoomControls = document.createElement('div');
      zoomControls.className = 'img-zoom-controls';

      const zoomInBtn = document.createElement('button');
      zoomInBtn.className = 'zoom-btn';
      zoomInBtn.textContent = '+';
      zoomInBtn.title = '放大筆記小圖';
      zoomInBtn.onclick = (e) => {
        e.stopPropagation();
        textDiv.querySelectorAll('.note-img-wrapper img').forEach(img => {
          let currentScale = parseFloat(img.dataset.scale || "1");
          currentScale = Math.min(3, currentScale + 0.25);
          img.dataset.scale = currentScale;
          img.style.transform = `scale(${currentScale})`;
        });
      };

      const zoomOutBtn = document.createElement('button');
      zoomOutBtn.className = 'zoom-btn';
      zoomOutBtn.textContent = '-';
      zoomOutBtn.title = '縮小筆記小圖';
      zoomOutBtn.onclick = (e) => {
        e.stopPropagation();
        textDiv.querySelectorAll('.note-img-wrapper img').forEach(img => {
          let currentScale = parseFloat(img.dataset.scale || "1");
          currentScale = Math.max(0.5, currentScale - 0.25);
          img.dataset.scale = currentScale;
          img.style.transform = `scale(${currentScale})`;
        });
      };

      zoomControls.appendChild(zoomInBtn);
      zoomControls.appendChild(zoomOutBtn);
      leftCol.appendChild(zoomControls);

      const previewBtn = document.createElement('button');
      previewBtn.className = 'preview-btn';
      previewBtn.textContent = '🖼️ 預覽';
      previewBtn.title = '彈出可拖曳大圖視窗';
      previewBtn.onclick = (e) => {
        e.stopPropagation();
        openImageModal(firstImg.src);
      };
      leftCol.appendChild(previewBtn);
    }

    div.appendChild(leftCol);
    div.appendChild(textDiv);
    div.appendChild(actionsDiv);
    notesDiv.appendChild(div);
  });
}

function resetForm() {
  editingIndex = null;
  noteTimeInput.value = "";
  noteTextInput.innerHTML = "";
  lastInputHtml = "";
  textInputHistory = [];
  textInputRedo = [];
  submitBtn.textContent = "新增筆記";
  submitBtn.classList.remove("editing");
  noteTextInput.focus();
  updateBoldButtonState();
}

function formatTime(sec) {
  let h = Math.floor(sec / 3600);
  let m = Math.floor((sec % 3600) / 60);
  let s = Math.floor(sec % 60);
  if(h > 0){
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  } else {
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }
}

function parseTime(input) {
  input = input.trim();
  if(/^\d+$/.test(input)) return parseInt(input, 10);
  let parts = input.split(':').map(p => parseInt(p,10));
  if(parts.length === 2) return parts[0]*60 + parts[1];
  if(parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return NaN;
}

function handleFormSubmit() {
  const t = parseTime(noteTimeInput.value);
  if(isNaN(t) || t < 0 || t > video.duration) {
    alert("請輸入有效的時間 (秒/mm:ss/hh:mm:ss)，且不得超過影片長度");
    return;
  }
  const text = noteTextInput.innerHTML.trim();
  if(text.length === 0 || text === "<br>") {
    alert("請輸入筆記內容");
    return;
  }

  saveNotesListState();

  if (editingIndex !== null) {
    notes[editingIndex] = {time: t, text};
  } else {
    notes.push({time: t, text});
  }

  renderNotes();
  saveNotesListState();
  resetForm();
}

addNoteForm.onsubmit = (e) => {
  e.preventDefault();
  handleFormSubmit();
};

noteTextInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (e.shiftKey) {
      return;
    } else {
      e.preventDefault();
      handleFormSubmit();
    }
  }
  
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    handleInputUndo();
  } else if ((e.ctrlKey && e.key.toLowerCase() === 'y') || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'z')) {
    e.preventDefault();
    handleInputRedo();
  }
});

saveBtn.onclick = () => {
  const dataStr = JSON.stringify(notes, null, 2);
  const blob = new Blob([dataStr], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'video_notes.json';
  a.click();
  URL.revokeObjectURL(url);
};

loadBtn.onclick = () => {
  loadNotesFile.click();
};

loadNotesFile.addEventListener('change', () => {
  if(loadNotesFile.files.length > 0){
    const file = loadNotesFile.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const loadedNotes = JSON.parse(e.target.result);
        if(Array.isArray(loadedNotes)){
          saveNotesListState();
          notes = loadedNotes.filter(n => typeof n.time === 'number' && typeof n.text === 'string');
          renderNotes();
          saveNotesListState();
        } else {
          alert("載入筆記格式錯誤");
        }
      } catch(e) {
        alert("載入筆記失敗: " + e.message);
      }
    }
    reader.readAsText(file);
  }
});

input.addEventListener('change', e => {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  video.play();
  document.body.focus();
});

window.addEventListener('keydown', e => {
  const activeEl = document.activeElement;
  
  if (e.key === 'F8') {
    e.preventDefault();
    video.pause();
    return;
  }
  if (e.key === 'F7') {
    e.preventDefault();
    video.play();
    return;
  }

  if (e.key === 'Escape') {
    if (imageModal.style.display === 'flex') {
      closeImageModal();
      return;
    }
    if (activeEl) activeEl.blur();
    return;
  }

  if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.id === 'noteText')) {
    return;
  }

  if(['ArrowLeft','ArrowRight',' ','f'].includes(e.key)) {
    e.preventDefault();
  }

  switch(e.key){
    case 'ArrowLeft':
      video.currentTime = Math.max(0, video.currentTime - 3);
      break;
    case 'ArrowRight':
      video.currentTime = Math.min(video.duration, video.currentTime + 3);
      break;
    case ' ':
      if(video.paused) video.play();
      else video.pause();
      break;
    case 'f':
      if(document.fullscreenElement) document.exitFullscreen();
      else video.requestFullscreen();
      break;
  }
});

video.addEventListener('click', () => {
  if (document.activeElement) {
    document.activeElement.blur();
  }
  const current = Math.floor(video.currentTime);
  noteTimeInput.value = formatTime(current);
});

let isDragging = false;
let currentResizeCorner = null;
let startX = 0, startY = 0;
let startLeft = 0, startTop = 0;
let startWidth = 0, startHeight = 0;

notesContainer.addEventListener('mousedown', (e) => {
  const isInteractive = e.target.closest('#addNoteForm') || 
                        e.target.closest('#notes div.note') || 
                        e.target.closest('#saveLoadBtns') ||
                        e.target.closest('#symbolPicker') ||
                        e.target.closest('.font-size-dropdown') ||
                        e.target.closest('.color-palette');

  if (isInteractive) return;

  if (e.target.classList.contains('corner-handle')) {
    currentResizeCorner = e.target.id;
    startX = e.clientX;
    startY = e.clientY;
    startWidth = notesContainer.offsetWidth;
    startHeight = notesContainer.offsetHeight;
    const style = window.getComputedStyle(notesContainer);
    startLeft = parseInt(style.left, 10) || 0;
    startTop = parseInt(style.top, 10) || 0;
    e.preventDefault();
    return;
  }

  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  const style = window.getComputedStyle(notesContainer);
  startLeft = parseInt(style.left, 10) || 0;
  startTop = parseInt(style.top, 10) || 0;
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    let deltaX = e.clientX - startX;
    let deltaY = e.clientY - startY;

    let newLeft = startLeft + deltaX;
    let newTop = startTop + deltaY;

    const maxTop = window.innerHeight - notesContainer.offsetHeight;
    newTop = Math.min(newTop, maxTop);

    notesContainer.style.left = newLeft + 'px';
    notesContainer.style.top = newTop + 'px';

  } else if (currentResizeCorner) {
    let deltaX = e.clientX - startX;
    let deltaY = e.clientY - startY;

    let newWidth = startWidth;
    let newHeight = startHeight;
    let newLeft = startLeft;
    let newTop = startTop;

    if (currentResizeCorner === 'handle-br') {
      newWidth = Math.max(240, startWidth + deltaX);
      newHeight = Math.max(250, startHeight + deltaY);
    } else if (currentResizeCorner === 'handle-bl') {
      newWidth = Math.max(240, startWidth - deltaX);
      newHeight = Math.max(250, startHeight + deltaY);
      newLeft = startLeft + (startWidth - newWidth);
    } else if (currentResizeCorner === 'handle-tr') {
      newWidth = Math.max(240, startWidth + deltaX);
      newHeight = Math.max(250, startHeight - deltaY);
      newTop = startTop + (startHeight - newHeight);
    } else if (currentResizeCorner === 'handle-tl') {
      newWidth = Math.max(240, startWidth - deltaX);
      newHeight = Math.max(250, startHeight - deltaY);
      newLeft = startLeft + (startWidth - newWidth);
      newTop = startTop + (startHeight - newHeight);
    }

    notesContainer.style.width = newWidth + 'px';
    notesContainer.style.height = newHeight + 'px';
    notesContainer.style.left = newLeft + 'px';
    notesContainer.style.top = newTop + 'px';
  }
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  currentResizeCorner = null;
});

window.addEventListener('DOMContentLoaded', () => {
  noteTextInput.focus();
  saveNotesListState();
});

renderNotes();
</script>
</body>
</html>
